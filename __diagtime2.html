<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>timeline2</title></head>
<body>
<style>
.vp-demo-canvas {
  position: relative;
  height: 320px;
  overflow: hidden;
  background: #fff;
  border: 1px solid #ccc;
}
</style>
<pre id="diag">loading...</pre>
<div id="box"></div>
<script type="module">
import { Storage, View, Image } from '/@fs/Users/shawn/workspace/leaf-plus/packages/core/src/index.ts';

const diag = document.getElementById('diag');
const errors = [];
window.addEventListener('error', (e) => errors.push('error: ' + e.message));
window.addEventListener('unhandledrejection', (e) => errors.push('unhandledrejection: ' + (e.reason && e.reason.message || e.reason)));
const logs = [];
const origWarn = console.warn, origError = console.error;
console.warn = (...a) => { logs.push('warn: ' + a.map(x => typeof x === 'string' ? x : JSON.stringify(x)).join(' ')); origWarn(...a); };
console.error = (...a) => { logs.push('error: ' + a.map(x => typeof x === 'string' ? x : (x && x.stack) || JSON.stringify(x)).join(' ')); origError(...a); };

const box = document.getElementById('box');

function sample(cv) {
  if (cv.width === 0) return 'canvas-0x0';
  const ctx = cv.getContext('2d');
  const data = ctx.getImageData(0, 0, cv.width, cv.height).data;
  let nonWhite = 0, transparent = 0;
  for (let i = 0; i < data.length; i += 4) {
    if (data[i+3] < 20) { transparent++; continue; }
    if (data[i] < 250 || data[i+1] < 250 || data[i+2] < 250) nonWhite++;
  }
  return { size: cv.width + 'x' + cv.height, nonWhite, transparent };
}

function buildView() {
  box.innerHTML = '';
  const container = document.createElement('div');
  container.className = 'vp-demo-canvas';
  container.style.display = 'none';   // 复刻 v-show="ready" 初始隐藏
  box.appendChild(container);

  const storage = new Storage();
  storage.setBackground('#ffffff');
  const view = new View(storage);
  view.mount(container);

  const meter = new Image();
  meter.setPosition(70, 30);
  meter.setSize(200, 200);
  meter.setImage('symbols/circleProgressBar.json');
  storage.add(meter);
  const peer = new Image();
  peer.setPosition(340, 70);
  peer.setSize(120, 120);
  peer.setImage('symbols/circleProgressBar.json');
  peer.a({ progressPercentage: 0.35, linearOuter: ['#f59e0b', '#ef4444'] });
  storage.add(peer);
  view.fitContent(24);

  return { container, view, storage };
}

async function run(tag) {
  const { container, view } = buildView();
  await new Promise(r => setTimeout(r, 800));
  const hiddenSample = sample(document.querySelector('#box canvas'));
  container.style.display = 'block';   // 复刻 ready=true
  await new Promise(r => setTimeout(r, 1500));
  const shownSample = sample(document.querySelector('#box canvas'));
  const shownViewClient = document.querySelector('#box .vp-demo-canvas div') ? document.querySelector('#box .vp-demo-canvas div').clientWidth + 'x' + document.querySelector('#box .vp-demo-canvas div').clientHeight : 'n/a';
  view.destroy();
  return { tag, hiddenSample, shownSample, shownViewClient };
}

const r1 = await run('first mount');
// 复刻「重跑」：重置后重建
await new Promise(r => setTimeout(r, 300));
const r2 = await run('after 重跑 rebuild');

diag.textContent = JSON.stringify({ r1, r2, errors, logs: logs.slice(0, 6) }, null, 2);
</script>
</body>
</html>
