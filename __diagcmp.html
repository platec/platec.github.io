<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>compare</title></head>
<body>
<pre id="diag">loading...</pre>
<script type="module">
import * as srcCore from '/@fs/Users/shawn/workspace/leaf-plus/packages/core/src/index.ts';
import * as distCore from '/core/leaf-plus.esm.js';

const diag = document.getElementById('diag');
const errors = [];
window.addEventListener('error', (e) => errors.push('error: ' + e.message));
window.addEventListener('unhandledrejection', (e) => errors.push('unhandledrejection: ' + (e.reason && e.reason.message || e.reason)));

function mkRun(core, name) {
  const stage = document.createElement('div');
  stage.id = 'stage-' + name;
  stage.style.cssText = 'display: none; width: 700px; height: 320px;';
  document.body.appendChild(stage);
  const pre = document.createElement('pre');
  document.body.appendChild(pre);

  return async function run() {
    const { Storage, View, Image } = core;
    const storage = new Storage();
    storage.setBackground('#ffffff');
    const view = new View(storage);
    view.mount(stage);
    const meter = new Image();
    meter.setPosition(70, 30);
    meter.setSize(200, 200);
    meter.setImage('symbols/circleProgressBar.json');
    storage.add(meter);
    view.fitContent(24);
    await new Promise(r => setTimeout(r, 800));
    const before = view.getCanvas().width + 'x' + view.getCanvas().height;
    const viewW = view.getView().clientWidth + 'x' + view.getView().clientHeight;
    stage.style.display = 'block';
    await new Promise(r => setTimeout(r, 1200));
    const after = view.getCanvas().width + 'x' + view.getCanvas().height;
    const afterViewW = view.getView().clientWidth + 'x' + view.getView().clientHeight;
    // 像素采样
    let stats = 'n/a';
    const cv = view.getCanvas();
    if (cv.width > 0) {
      const ctx = cv.getContext('2d');
      const data = ctx.getImageData(0, 0, cv.width, cv.height).data;
      let nonWhite = 0, transparent = 0;
      for (let i = 0; i < data.length; i += 4) {
        const a = data[i+3];
        if (a < 20) { transparent++; continue; }
        if (data[i] < 250 || data[i+1] < 250 || data[i+2] < 250) nonWhite++;
      }
      stats = JSON.stringify({ nonWhite, transparent, total: data.length / 4 });
    }
    pre.textContent = JSON.stringify({ core: name, before, viewW, after, afterViewW, stats }, null, 2);
  };
}

const runs = [mkRun(srcCore, 'SOURCE'), mkRun(distCore, 'DIST')];
Promise.all(runs.map(r => r())).then(() => {
  diag.textContent = JSON.stringify({ errors, done: true }, null, 2);
}).catch(e => diag.textContent = 'threw: ' + e.stack);
</script>
</body>
</html>
