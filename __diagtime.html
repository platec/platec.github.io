<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>timeline</title></head>
<body>
<pre id="diag">loading...</pre>
<script type="module">
import { Storage, View, Image } from '/@fs/Users/shawn/workspace/leaf-plus/packages/core/src/index.ts';

const diag = document.getElementById('diag');
const errors = [];
window.addEventListener('error', (e) => errors.push('error: ' + e.message));
window.addEventListener('unhandledrejection', (e) => errors.push('unhandledrejection: ' + (e.reason && e.reason.message || e.reason)));

const stage = document.createElement('div');
stage.id = 'stage';
stage.style.cssText = 'display: none; width: 700px; height: 320px; background: #fff;';
document.body.appendChild(stage);
const pre = document.createElement('pre');
document.body.appendChild(pre);

const snap = () => {
  const cv = document.querySelector('#stage canvas');
  const viewEl = document.querySelector('#stage .leaf-plus-view') || document.querySelector('#stage div');
  return {
    canvas: cv ? cv.width + 'x' + cv.height : 'none',
    viewClient: viewEl ? viewEl.clientWidth + 'x' + viewEl.clientHeight : 'none',
    stageDisplay: getComputedStyle(stage).display,
    stageClient: stage.clientWidth + 'x' + stage.clientHeight,
  };
};

async function main() {
  const storage = new Storage();
  storage.setBackground('#ffffff');
  const view = new View(storage);
  view.mount(stage);
  const t = [];
  t.push(['after mount', snap()]);

  const meter = new Image();
  meter.setPosition(70, 30);
  meter.setSize(200, 200);
  meter.setImage('symbols/circleProgressBar.json');
  storage.add(meter);
  t.push(['after add', snap()]);
  view.fitContent(24);

  await new Promise(r => setTimeout(r, 500));
  t.push(['+500ms (hidden)', snap()]);

  stage.style.display = 'block';
  await new Promise(r => setTimeout(r, 100));
  t.push(['+100ms after show', snap()]);
  await new Promise(r => setTimeout(r, 400));
  t.push(['+500ms after show', snap()]);
  await new Promise(r => setTimeout(r, 1000));
  t.push(['+1500ms after show', snap()]);

  // 触发一次手动 redraw 验证是否可绘制
  const cv = document.querySelector('#stage canvas');
  let manual = 'n/a';
  if (cv && cv.width > 0) {
    try {
      view.getStorage().emitChange('manual-test');
      await new Promise(r => setTimeout(r, 300));
      const ctx = cv.getContext('2d');
      const data = ctx.getImageData(0, 0, cv.width, cv.height).data;
      let nonWhite = 0;
      for (let i = 0; i < data.length; i += 4) {
        if (data[i+3] > 20 && (data[i] < 250 || data[i+1] < 250 || data[i+2] < 250)) nonWhite++;
      }
      manual = { size: cv.width + 'x' + cv.height, nonWhite };
    } catch (e) { manual = 'err: ' + e.message; }
  }

  pre.textContent = JSON.stringify({ timeline: t, manual, errors }, null, 2);
  diag.textContent = 'done';
}
main().catch(e => { diag.textContent = 'threw: ' + e.stack; });
</script>
</body>
</html>
