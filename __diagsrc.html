<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>diag-source</title></head>
<body>
<div id="stage" style="display: none; width: 700px; height: 320px;"></div>
<pre id="diag">loading...</pre>
<script type="module">
import { Storage, View, Image } from '/@fs/Users/shawn/workspace/leaf-plus/packages/core/src/index.ts';

const diag = document.getElementById('diag');
const errors = [];
window.addEventListener('error', (e) => errors.push('error: ' + e.message + ' @' + e.lineno));
window.addEventListener('unhandledrejection', (e) => errors.push('unhandledrejection: ' + (e.reason && e.reason.message || e.reason)));
const logs = [];
const origWarn = console.warn, origError = console.error;
console.warn = (...a) => { logs.push('warn: ' + a.map(x => typeof x === 'string' ? x : JSON.stringify(x)).join(' ')); origWarn(...a); };
console.error = (...a) => { logs.push('error: ' + a.map(x => typeof x === 'string' ? x : (x && x.stack) || JSON.stringify(x)).join(' ')); origError(...a); };

function sample(canvas) {
  if (canvas.width === 0) return 'canvas-0x0';
  const ctx = canvas.getContext('2d');
  const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
  let gray = 0, warm = 0, cool = 0, nonWhite = 0, transparent = 0;
  for (let i = 0; i < data.length; i += 4) {
    const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
    if (a < 20) { transparent++; continue; }
    if (r < 250 || g < 250 || b < 250) nonWhite++;
    const isGray = Math.abs(r-g) < 15 && Math.abs(g-b) < 15;
    if (isGray && r > 35 && r < 95) gray++;
    if (r > 150 && g > 50 && g < 200 && b < 120) warm++;
    if (b > 150 && g > 100 && r < 120) cool++;
  }
  return { gray, warm, cool, nonWhite, transparent, total: data.length / 4 };
}

const stage = document.getElementById('stage');

async function main() {
  const storage = new Storage();
  storage.setBackground('#ffffff');
  const view = new View(storage);
  view.mount(stage);   // 挂载时 display:none

  const meter = new Image();
  meter.setPosition(70, 30);
  meter.setSize(200, 200);
  meter.setImage('symbols/circleProgressBar.json');
  storage.add(meter);
  const peer = new Image();
  peer.setPosition(340, 70);
  peer.setSize(120, 120);
  peer.setImage('symbols/circleProgressBar.json');
  peer.a({ progressPercentage: 0.35, linearOuter: ['#f59e0b', '#ef4444'] });
  storage.add(peer);
  view.fitContent(24);

  await new Promise(r => setTimeout(r, 1000));
  const before = [];
  for (const cv of document.querySelectorAll('#stage canvas')) before.push(sample(cv));

  stage.style.display = 'block';
  await new Promise(r => setTimeout(r, 1500));

  const after = [];
  for (const cv of document.querySelectorAll('#stage canvas')) after.push(sample(cv));

  diag.textContent = JSON.stringify({
    coreUrl: '/@fs/.../core/src/index.ts',
    before,
    after,
    errors,
    logs: logs.slice(0, 8),
  }, null, 2);
}

main().catch(e => { diag.textContent = 'main threw: ' + e.stack; });
</script>
</body>
</html>
